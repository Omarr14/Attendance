
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الحضور</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      direction: rtl;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      box-sizing: border-box;
    }
    main {
      width: 100%;
      max-width: 440px;
      box-sizing: border-box;
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #0001;
    }
    h1 { font-size: 25px; }
    p { line-height: 1.9; color: #475569; }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #1d4ed8;
      color: white;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #status {
      margin-top: 18px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 12px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }
    .small { font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>تسجيل الحضور والانصراف</h1>
  <p>
    لتسجيل حضورك، اضغط على الزر أدناه واسمح للمتصفح
    بالوصول إلى موقعك. يجب أن تكون على بُعد ٢٠٠ متر
    أو أقل من مقر العمل للانتقال إلى نموذج تسجيل الحضور.
  </p>

  <button id="check">التحقق من موقعي</button>

  <div id="status" role="status" aria-live="polite">
    جاهز للتحقق من الموقع.
  </div>

  <p class="small">
    إذا لم يعمل تحديد الموقع، تأكد من تشغيل خدمة الموقع
    في هاتفك والسماح للمتصفح باستخدامها.
  </p>
</main>

<script>
  // إحداثيات مقر العمل
  const OFFICE_LAT = 30.013494;
const OFFICE_LON = 31.761929;

  // رابط نموذج Google Forms
  const GOOGLE_FORM_URL =
    "https://docs.google.com/forms/d/e/1FAIpQLSeYd5y_qFG1qB8N_xDXci69Tl1Wn2uMUuCs6s7qAZn1sczvmQ/viewform";

  const MAX_DISTANCE = 200;
  const button = document.getElementById("check");
  const status = document.getElementById("status");

  function distanceInMetres(lat1, lon1, lat2, lon2) {
    const rad = value => value * Math.PI / 180;
    const earthRadius = 6371000;

    const dLat = rad(lat2 - lat1);
    const dLon = rad(lon2 - lon1);

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(rad(lat1)) *
      Math.cos(rad(lat2)) *
      Math.sin(dLon / 2) ** 2;

    return 2 * earthRadius *
      Math.asin(Math.sqrt(Math.min(1, a)));
  }

  button.addEventListener("click", () => {
    if (!navigator.geolocation) {
      status.textContent =
        "المتصفح لا يدعم تحديد الموقع. يُرجى استخدام متصفح حديث.";
      return;
    }

    button.disabled = true;
    status.textContent =
      "جارٍ تحديد موقعك... يُرجى السماح بالوصول إلى الموقع.";

    navigator.geolocation.getCurrentPosition(
      position => {
        const { latitude, longitude } = position.coords;

        const distance = distanceInMetres(
          latitude, longitude,
          OFFICE_LAT, OFFICE_LON
        );

        if (distance <= MAX_DISTANCE) {
          status.textContent =
            "تم التحقق من موقعك. جارٍ فتح نموذج الحضور...";

          window.location.assign(GOOGLE_FORM_URL);
        } else {
          status.textContent =
            `أنت على بُعد ${Math.round(distance)} متر من مقر العمل. ` +
            "يجب أن تكون على بُعد ٢٠٠ متر أو أقل. " +
            "اقترب من المقر وحاول مرة أخرى.";

          button.disabled = false;
        }
      },
      error => {
        const messages = {
          1: "لم تسمح بالوصول إلى الموقع. فعّل إذن الموقع للمتصفح وحاول مرة أخرى.",
          2: "تعذّر تحديد موقعك. تأكد من تشغيل خدمة الموقع في الهاتف.",
          3: "استغرق تحديد الموقع وقتًا طويلًا. حاول مرة أخرى."
        };

        status.textContent =
          messages[error.code] || "حدث خطأ. حاول مرة أخرى.";

        button.disabled = false;
      },
      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );
  });
</script>
</body>
</html>
